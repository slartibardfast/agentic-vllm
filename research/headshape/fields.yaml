# Field definitions — generated by /research (ZCode/Z.ai edition)
# detail_level hierarchy: brief -> moderate -> detailed
fields:
  architecture:
    - name: name
      description: Item name, matching the outline item slug.
      detail_level: brief
    - name: head_dims
      description: Primary head dimension(s) the item concerns (model family, kernel coverage set, or design target).
      detail_level: brief
    - name: qkv_dim_divergence
      description: Whether qk_dim differs from v_dim (MLA 576/512, partial-RoPE); the head_dim-as-tuple view.
      detail_level: moderate
    - name: kv_heads_gqa
      description: KV-head count and GQA ratio where applicable.
      detail_level: brief
    - name: hybrid_pattern
      description: Linear-attention vs full-attention layer pattern (e.g. 3:1 Gated DeltaNet:full, full_attention_interval).
      detail_level: moderate
    - name: heterogeneous_dims
      description: Per-layer head-dim divergence within one model (local vs global layers, e.g. Gemma-4 512 globals).
      detail_level: moderate

  kernel_support:
    - name: supported_dims
      description: The head-dim coverage set and HOW it is achieved (template instantiation, padding, generic autotune).
      detail_level: moderate
    - name: capability_gate
      description: Compute-capability floor and the real blockers behind it (cp.async, smem, CI, fixed bugs).
      detail_level: moderate
    - name: fallback_semantics
      description: What happens on unsupported dims - error, silent slow fallback, padding, or eager.
      detail_level: moderate
    - name: ci_hardware_coverage
      description: Whether CI actually exercises sm_75/Turing; which supported claims have rotted.
      detail_level: moderate

  performance:
    - name: turing_baseline
      description: Same-hardware (T4/2080Ti/RTX 6000-class) measured numbers where they exist, with source.
      detail_level: detailed
    - name: d256_feasibility
      description: Is d=256 achievable in the item's context (smem/register/accumulator analysis for kernels; availability for models).
      detail_level: detailed
    - name: cost_analysis
      description: Quantified cost of the approach - register/smem budgets, mma counts, chunking overhead, compile time.
      detail_level: detailed

  design_fit:
    - name: route
      description: Which bridge route the item informs - A native d=256 template, B k-chunked 256 on the 128 pipeline, C bridge-header completeness for unmodified FA2/FlashInfer.
      detail_level: brief
    - name: recommendation
      description: The concrete takeaway for the sm_75 bridge kernel plan (design choice, target set, next action).
      detail_level: moderate
    - name: numerics_risks
      description: Correctness risks - accumulation order at d=256, softcap, BF16 absence, documented wrong-output history.
      detail_level: moderate
    - name: demand_weighting
      description: Who benefits - installed base, cloud presence, model distribution over head shapes.
      detail_level: moderate

# Reserved: fields the deep phase could not confirm; auto-filled there.
uncertain: []
