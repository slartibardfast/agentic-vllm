    summary: Decode-kernel and scheduling SoTA March-September 2026 (FlashMLA-class, FlashDecoding++ successors, DeepGEMM, vLLM V1 scheduler evolution, cc 7.5-relevant work) - the delta since the lacunae corpus froze 2026-09-07.
