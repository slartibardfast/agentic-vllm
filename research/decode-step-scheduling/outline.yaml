topic: "Decode-step scheduling and kernel-structure SOTA to close the last fifth between the bridge paged-split decode attention (0.82 of the TRITON baseline) and parity on TU102 (sm_75, TP2)"
search_endpoints: international
constraint_frame: >
  No cp.async/TMA (Turing), 2-resident-CTA occupancy law, conflicted STS halves,
  535 GB/s DRAM, 8 full-attention d256 layers of 32 (24 GDN), TP2 NVLink pair,
  W4A16 Marlin GEMMs streaming ~9 GiB/step/rank, batch 4-8, ctx 512-2048,
  CUDA graphs on. The gap is ~4.3 ms of a 24.3 ms ctx2048 step while attention's
