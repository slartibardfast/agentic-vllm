    summary: CUDA-graph fork/join and parallel branches in decode steps; multi-stream overlap of independent layer work; extends the banked memset-replay-gap datapoint (lacunae cuda-graph-atomic-reduction).
  - name: step-roofline-method
    summary: Analytical decode-step decomposition - per-kernel latency-vs-bandwidth regime classification; calx-mill's TU102 adapter as the house instrument; decides where the ~4.3 ms/step lives before surgery. Feeds plan/0002#performance-model.
