# Field definitions — generated by /research (ZCode/Z.ai edition)
# Run: 2026-09-14 | the last fifth: decode-step scheduling x sm_75
# detail_level hierarchy: brief -> moderate -> detailed
fields:
  lacuna:
    - name: name
      description: Item name, matching the outline item slug.
      detail_level: brief
    - name: repo_anchor
      description: Where this host's records already touch the topic (plan READMEs, ledger, PROFILE-DELTA, lacunae items) - quoted so findings stay grounded.
      detail_level: brief
    - name: current_status
      description: Ecosystem state as of the research date - papers, repos, documented patterns, with versions/dates.
      detail_level: detailed
    - name: applicability
      description: What specifically transfers to the sm_75 bridge decode step (the constraint frame); what does not and why.
      detail_level: detailed

  design:
    - name: mechanism
      description: The concrete mechanism to adopt (kernel structure, schedule, fusion boundary) - precise enough to implement cold against the split walk/combine kernels.
      detail_level: detailed
    - name: failure_modes
      description: How the pattern fails in the wild (numerics, replay safety, occupancy, register pressure) and the known defenses; cite this host's falsified levers where they rhyme.
      detail_level: moderate
    - name: effort_estimate
      description: Scope to land on this host - kernel-lane days, engine-lane days, or doctrine-only; the gate-1 cull cost.
      detail_level: brief
    - name: priority_signal
      description: Arguments for/against this being load-bearing for closing the ~4.3 ms/step, given the sensitivity floor (only multi-ms deltas move committed rows).
      detail_level: moderate

  evidence:
    - name: sources
      description: Key citations with dates; prefer upstream source and papers over blogs.
      detail_level: brief

uncertain: []
