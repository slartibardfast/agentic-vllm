# Field definitions — generated by /research (ZCode/Z.ai edition)
# Run: 2026-09-11 | long-range agentic campaigns x weco local (full sweep, international)
# detail_level hierarchy: brief -> moderate -> detailed
fields:
  lacuna:
    - name: name
      description: Item name, matching the outline item slug.
      detail_level: brief
    - name: repo_anchor
      description: Where this host's records already touch the topic (MEMORY, ledger, runbook, weco fork source) - quoted so findings stay grounded.
      detail_level: brief
    - name: current_status
      description: Ecosystem state as of the research date - what tools, papers, or documented patterns exist, with versions/dates.
      detail_level: detailed
    - name: applicability
      description: What specifically transfers to the weco-local long-range runner (resume, timeout, watchdog, lanes, cadence); what does not and why.
      detail_level: detailed

  design:
    - name: mechanism
      description: The concrete mechanism to adopt (data structure, exit-code contract, supervision pattern) - precise enough to implement cold.
      detail_level: detailed
    - name: failure_modes
      description: How the pattern fails in the wild (hung evals, poisoned metrics, silent skips, drift) and the known defenses.
      detail_level: moderate
    - name: effort_estimate
      description: Scope to land in tools/campaign-runner or the upstream fork - wrapper-level, fork-level, or doctrine-only.
      detail_level: brief
    - name: priority_signal
      description: Arguments for/against this being load-bearing for multi-day campaigns on this host.
      detail_level: moderate

  evidence:
    - name: sources
      description: Key citations with dates; prefer upstream docs, source code, and papers over blog posts.
      detail_level: brief

uncertain: []
