# Field definitions — generated by /research (ZCode/Z.ai edition)
# Run: 2026-09-07 | lacunae of future work (full 13-item sweep, international, last 6 months)
# detail_level hierarchy: brief -> moderate -> detailed
fields:
  lacuna:
    - name: name
      description: Item name, matching the outline item slug.
      detail_level: brief
    - name: repo_anchor
      description: Where this host records the gap (plan/NNNN stage, MEMORY entry, macro-gate record) - quote the anchor so the item stays grounded in the house records.
      detail_level: brief
    - name: current_status
      description: Ecosystem state as of the research date - what upstream projects, kernels, or papers exist for this surface, with versions and dates.
      detail_level: detailed
    - name: sm75_viability
      description: What actually runs on Turing-class hardware (T4/2080Ti/RTX 6000) today - measured numbers where they exist, capability floors and their real blockers, fallback semantics. Include the attention-backend candidate matrix and the Triton codegen path (mma.884 / FMA / pinned <=3.2) where they gate the item.
      detail_level: detailed
    - name: upstream_base
      description: The per-release last-good upstream base for this surface - which vLLM/Triton/FlashInfer release introduced, fixed, or dropped sm75 support for it, as a dated ledger line the fork can rebase onto.
      detail_level: moderate

  effort_value:
    - name: effort_estimate
      description: Scope to land on this host - adapter + registry row, kernel ladder entry, or full campaign; rough size.
      detail_level: moderate
    - name: unlocks
      description: What it unblocks - model classes, formats, gates, or the operator's serving targets.
      detail_level: moderate
    - name: dependency_order
      description: What must land first (repo-internal dependencies and external prerequisites), and what can proceed in parallel.
      detail_level: moderate
    - name: risk_notes
      description: Correctness and numerics risks (accumulation order, outlier handling, silent fallbacks) and upstream-drift exposure.
      detail_level: moderate
    - name: determinism_class
      description: Reproducibility class of the mechanisms involved - bitwise vs statistical; atomics/split-K ordering, run-to-run and restart-to-restart variance sources; what the float64-oracle + median-of-N gate discipline needs to hold.
      detail_level: moderate

  decision:
    - name: priority_signal
      description: Arguments for and against doing this next - operator value, ecosystem momentum, risk of the window closing.
      detail_level: moderate
    - name: recommended_probe
      description: The cheapest gate-0-style probe (oracle-checked, no timing until numerics are proven) that would settle viability on this hardware.
      detail_level: moderate
    - name: sources
      description: Key citations with dates; prefer upstream docs, issues, and papers over blog posts.
      detail_level: brief

# Reserved: fields the deep phase could not confirm; auto-filled there.
uncertain: []
