topic: "The lacunae of future work for sm_75 (Turing) LLM serving: engine/runtime, kernels, formats, and ecosystem strategy - ecosystem status and next-probe recommendation per gap"
created: "2026-09-07"

# Either/or per run (single Z.ai account), chosen at the Step 2 gate.
search_endpoints: international

items:
  - name: tp2-decode-variance-engine
    category: engine-serving
    description: "plan/0007 names this the next campaign: TP=2 decode rows swing 12.0-17.5 tok/s between engine restarts on both kernel variants, deficit judged engine-level; next instrument nsys/ncu. Leads: vLLM #19576 (15% run-to-run benchmark variance), async-scheduling default since v0.14.0 (#27614), Model Runner V2 GPU-native input prep, NCCL transport selection at communicator init as a per-restart variable, Thinking Machines 'Defeating Nondeterminism in LLM Inference' (atomic-based reductions as top drift cause), #35048 versioned regression, Red Hat 5-step vLLM triage methodology."
  - name: turing-engine-upstream-drift
    category: engine-serving
    description: "plan/0005 stage 11, the load-bearing row. The floor bifurcated in 2026: v0.11.1 re-enabled FP16 on Turing via FlashInfer; v0.14.0 shipped 'Marlin for Turing sm75' (#29901/#31000); v0.23.0 is the last-good FlashInfer-on-sm75 base; v0.24.0 dropped FlashInfer from SM7.5 candidates (#47549: 18x RTX 8000 fleet, 2x KV-capacity loss, 5-10x decode slowdown at 22K ctx); TRT-LLM is Ampere+; SGLang effectively Ampere+ (#7467); Qwen3-VL Turing request #29743 closed not-planned; Gemma4 #38918 all backends blocked. Deliver a per-release sm75 compatibility ledger and an attention-backend candidate matrix for sm75."
  - name: cuda-graph-atomic-reduction
    category: engine-serving
    description: "MEMORY 2026-08-28 + cuda_graph_validation.md: split-K atomicAdd accumulation requires WS zeroed between CUDA-graph replays; fix options are a dedicated memset node or per-split output buffers + final reduction. Leads: cudaMemsetAsync nodes serialize graph replay vs a fill kernel (PyTorch forums), CUTLASS Stream-K turnstile semaphore reduction as the deterministic-graph alternative, DAB deterministic atomic buffering (MICRO'53), Thinking Machines bitwise-reproducible all-reduce/split-K substitutions, NVIDIA CCCL determinism guidance."
  - name: both-card-tp-nvlink-serving
    category: engine-serving
    description: "plan/0005 stage 13, the operator target: Qwen3-class ~27B across 2x RTX 6000 (48 GB aggregate) over the NVLink bridge, W4A16. Direct precedent: weicj/vLLM-2080Ti-Definitive (dual 22GB 2080 Ti + NVLink TP=2, vLLM 0.21.0 base, 2026-active, 100+ tok/s single-request decode on Qwen3.6-27B FP8, AWQ/GPTQ/NVFP4/INT8 KV, MTP3, 35B MoE secondary). Alternative topology: KTransformers CPU+GPU hybrid. Include the KV-capacity envelope (tokens per GB per KV dtype) and preemption coupling at long context."
  - name: w4a16-perf-acceptance
    category: kernels
    description: "plan/0002/0004 acceptance still open: incumbent sm75 Marlin 51-57 TFLOP/s at M512 vs our 23-25; named remaining work is split-K small-M, deeper software pipeline, register-resident dequant, repack interleave. New comparison target: upstream 'Marlin for Turing' itself (v0.14.0+, #29901) - original Marlin relies on cp.async (Ampere+), so the sm75 port substitutes pipelining, exactly where the gap should be attacked; also W8A16-FP8-weights Marlin is the documented Turing quant path, and weicj/vLLM-2080Ti-Definitive is the sibling to benchmark against."
  - name: paged-varlen-decode-sm75
    category: kernels
    description: "plan/0007 backlog: the bridge kernel integrates with the existing gather path; a paged/varlen decode kernel is the gap. Leads: ik_llama.cpp (CUDA Turing+, faster DeepSeek FA, Q8_0 KV, FlashMLA-2; #1142 q4/q5 KV + FA corruption, q8_0 works), johnscheuer/flash-attention-sm75 (~27% end-to-end gain + INT8-attention variant), FlashInfer plan/phase decode kernels (the only vendor-supported SM75 decode attention; arXiv 2501.01005), llama.cpp #19036 (FA + KV-quant fails on long prompts)."
  - name: d512-chunked-mma
    category: kernels
    description: "plan/0007 phase-3 design note: head_dim 512 as a chunk-count change on the k-chunked m16n8k8 chains. The model list is now concrete: Gemma 4 global layers head_dim 512 (8Q/4KV heads; sliding layers 256); FA2 hard-caps at 256 (flash-attention #2427); support exists only via FlashInfer TRTLLM head_dim=512 (vLLM #38822) and FA4 (Hopper-only); vLLM forces TRITON_ATTN for Gemma4 which on sm75 means FMA-only math; heterogeneous 256/512 page sizes additionally break KV-page unification (#41403). Precedents for 512-deep QK^T/PV mma chains on pre-sm80 hardware."
  - name: gdn-linear-attention-sm75
    category: kernels
    description: "plan/0007 future item: an sm_75 GDN microbench; the linear side is FLA-Triton-served today. Leads: FlashQLA (Qwen 2026, TileLang GDN kernels, 2-3x forward speedup, SM90+/100/103/120/121 + CUDA 12.8 only) and the community fork weicj/FlashQLA-SM70-SM75 (forward-inference-only sm70/sm75 adaptation proving the port feasible); FLA regression #792 (garbage output on Qwen3.5-4B; pin fla 0.4.2); Triton never emitted Turing-native mma.1688 (used Volta mma.884 at half throughput, triton #189) and Triton >=3.3 emits no tensor-core math on sm75 at all."
  - name: mla-triton-portability
    category: kernels
    description: "plan/0005 stage 12: FlashMLA is sm_90/Blackwell-only; the emulated path is Triton-MLA, unmeasured on Turing; the 576/512 and 320/256 kv-dim tuples are reachable by the bridge structure. Leads: vLLM triton_mla decode backend (non-Hopper MLA path, sm80+ in practice), ik_llama.cpp FlashMLA-2 + Q8_0 KV as the only sub-Ampere MLA-adjacent attention shipping today, DeepSeek V3.2-class sparse attention (DSA) kernels Hopper-focused - non-Hopper DSA emulation is an open 2026 gap."
  - name: mxfp4-nvfp4-ecosystem
    category: formats
    description: "plan/0005 stages 8-9: E2M1 values via a 16-entry nibble LUT, E8M0 power-of-two block scales (MXFP4, 32-element blocks) / E4M3 block scales (NVFP4, 16-element blocks), reusing the FP8 rebias. 2026 movement: v0.14.0 added NVFP4 Marlin for NVFP4A16 MoEs (#30881), MXFP4 W4A16 dense (#31926), MXFP4 LoRA (#30598); nominally CC>=75 but #33461 reports garbage outputs on real Turing (2080 Ti) and docs state 'Turing does not support Marlin MXFP4'; emulation runs on Triton tl.dot_scaled (fp16 upcast + LUT) which on sm75 collides with the Triton FMA floor; also cover gpt-oss CC-floor thread #23203, #38022 and #34694, and which checkpoints exist per target model."
  - name: fp8-kv-and-activations
    category: formats
    description: "plan/0005 stages 6-7: W8A8 emulated (activations rounded onto the E4M3 grid, stored and computed in FP16 - faithful emulation, no hardware FP8) and FP8 KV (recast to fp16 at 2x memory, or int8 measured against fp16 quality). 2026 reality: FP8-KV-on-Turing is currently a regression hole, not just a quality question - FlashInfer software-converted FP8 KV on sm75 until v0.24.0 removed it (#47549), and Triton cannot do fp8e4nv below SM89. TurboQuant (Google DeepMind, ICLR 2026: 3-4-bit KV near-lossless; vLLM study 2026-05-11; llama.cpp port; community vLLM port at 3.7x compression) is the strongest long-context lever for 24 GB cards. Also account the native INT8/INT4 IMMA + dp4a track (W8A8 INT8 via SmoothQuant/LLM-Compressor, QServe W4A8KV4, Red Hat W8A8 write-up 2026-09-07) - Turing's only native sub-16-bit tensor-core math, distinct from emulated FP8."
  - name: autoround-lowbit-landscape
    category: formats
    description: "plan/0005 stage 4: AutoRound W4A16 asymmetric + ZP through the staged strategy (already zero-point-capable); W2A16 as 16-weights-per-u32; W3A16 as a 3-bit packing row. 2026: AutoRound W4A16 is now a first-class vLLM quant config (#39778); compressed-tensors moved under the vllm-project org (post-Neural-Magic consolidation); compressed-tensors #458 (asymmetric packed zero-points not unpacked on load) is the concrete W2A16/W3A16-asymmetric bug object; v0.14.0 removed deprecated quant schemes (#31688). Which W2/W3/W4 checkpoints exist per target model and are loadable by an sm75 kernel path."
  - name: bf16-outlier-recast-practice
    category: formats
    description: "plan/0005 stage 10: recast bf16->fp16 at load (8 mantissa bits fit fp16's 10) with an overflow range check - >65504 outliers reported, never silently truncated. Leads: Unsloth's Gemma-3 fp16 investigation (fp16 engines produced garbage; per-layer outlier magnitudes), transformers #39972 ('if your hardware is too old for bf16, use another framework' as the canonical refusal), arXiv:2510.26788 (Defeating the Training-Inference Mismatch via FP16 - counter-evidence that fp16 inference can be beneficial, worth reconciling with recast practice), and vLLM v0.11.1's 're-enabled FP16 on Turing' implying an earlier disable window whose precedent list is recoverable."
  - name: upstream-marlin-turing-delta
    category: ecosystem-strategy
    description: "New from supplementation: upstream shipped 'Marlin for Turing' (v0.14.0+), so the fork's differentiator must now be measured against the merged upstream sm75 Marlin path and the weicj/vLLM-2080Ti-Definitive sibling fork. Decide rebase-vs-diverge per kernel class (dense GEMM, MoE GEMM, attention) and per upstream base (v0.23.0 FlashInfer-sm75 last-good vs v0.24+/Model Runner V2); deliver the per-release last-good-upstream-base ledger for sm75."
  - name: moe-kernels-sm75
    category: ecosystem-strategy
    description: "New from supplementation: the 2026 model mix is MoE-heavy (Qwen3-30B-A3B class, gpt-oss-20b, Gemma 4 27B-A4B, Qwen3.x 35B MoE) while this fork's MoE grouped forward is plan/0002-validated but untuned. Marlin-MoE-on-sm75 landed only in 2026; open crash surface (#35922 compressed-tensors MoE, #38022 Marlin MoE x MXFP4 gpt-oss); fused-MoE Triton tuning configs are missing for non-flagship GPUs (and are FMA-bound on sm75 anyway). What the MoE-on-Turing acceptance and regression surface should be."
  - name: spec-decode-on-sm75
    category: ecosystem-strategy
    description: "New from supplementation: EAGLE-3 (2025) -> P-EAGLE (AWS, mainline vLLM early 2026), MTP (DeepSeek-style; MTP3 used by the 2080Ti fork), ngram lookahead - all engine-level and architecture-agnostic, uniquely valuable on memory-bound Turing decode; no Turing spec-decode benchmarks exist (#21278 shows spec-decode failing to help on constrained GPUs). The acceptance-rate x draft-cost math on FMA/CUDA kernels for this hardware."
  - name: sibling-fork-ecosystem-crosspoll
    category: ecosystem-strategy
    description: "New from supplementation: weicj/vLLM-2080Ti-Definitive + weicj/FlashQLA-SM70-SM75 + ik_llama.cpp + johnscheuer/flash-attention-sm75 form a 2026-active parallel sm75 serving ecosystem. Systematic technique transfer (FlashQLA sm75 prefill adaptation, TurboQuant/INT8 KV integration, MTP routing, NVFP4-on-Marlin) is an unmanaged dependency surface. Survey what each carries, maintenance health, and what this fork should adopt versus rebuild."
  - name: triton-fma-floor-sm75
    category: ecosystem-strategy
    description: "New from supplementation, possibly the load-bearing constraint: Triton >=3.3 dropped MMAv1; sm75 gets FMA-only codegen (triton #5066; 'restore Turing MMA' PR closed unmerged Apr 2026; maintainers: pre-Ampere best-effort, no perf patches). Every Triton fallback the other items assume (V1 TRITON_ATTN, FLA/GDN, Triton MLA, fused-MoE, MXFP4 tl.dot_scaled) is FMA-slow or broken on sm75, and MXFP4 emulation requires Triton >=3.4 while Turing tensor-core health requires <=3.2 - a dependency deadlock. Which kernels, version pins, or patches escape it, and what a CUDA-native substitute strategy looks like."
  - name: ktransformers-cpu-gpu-hybrid
    category: ecosystem-strategy
    description: "New from supplementation: for 27B+/MoE on this host TP=2 is not the only topology. KTransformers (ACM 2026 paper; SGLang integration Oct 2025) shows 3-28x MoE speedups via CPU-resident experts + GPU attention/shared-experts, 220+ tok/s aggregate on trillion-param MoE with one consumer GPU. Feasibility on 2x Turing + host CPU RAM, measured precedents on workstation hardware, and the integration surface versus vLLM TP=2."
  - name: engine-kv-capacity-preemption-coupling
    category: ecosystem-strategy
    description: "New from supplementation: issue #47549 demonstrates the full failure chain - backend loss -> KV dtype loss -> 2x capacity loss -> preemption storms -> 5-10x effective slowdown at 22K context. Capacity math (tokens of KV per GB by dtype: fp16, int8, fp8-emulated, TurboQuant 3/4-bit) plus preemption behavior at overflow is a first-class design variable on 2x24 GB, currently implicit in the serving and KV items. Build the envelope table for the operator's target models (Qwen3-class 27B W4A16 class, MoE 30B-A3B class, long-context 22K+)."

